name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

  backend:
    name: Backend Docker Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t cafe-kaya-api ./backend

      - name: Verify container starts
        run: |
          docker run -d --name cafe-kaya-test \
            -e CAFE_DATABASE_URL="${{ secrets.TEST_DATABASE_URL }}" \
            -e JWT_SECRET="${{ secrets.TEST_JWT_SECRET }}" \
            -e GOOGLE_PLACES_API_KEY="${{ secrets.TEST_GOOGLE_PLACES_API_KEY }}" \
            cafe-kaya-api

          sleep 5
          docker logs cafe-kaya-test
          docker stop cafe-kaya-test
          docker rm cafe-kaya-test

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ secrets.TEST_DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
          POSTGRES_DB: ${{ secrets.TEST_DB_NAME }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Run pytest with coverage
        env:
          CAFE_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          JWT_SECRET: ${{ secrets.TEST_JWT_SECRET }}
          GOOGLE_PLACE_ID: ${{ secrets.TEST_GOOGLE_PLACE_ID }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.TEST_GOOGLE_PLACES_API_KEY }}
        run: |
          cd backend
          .venv/bin/python -m pytest tests/ -v --cov=app --cov-branch --cov-fail-under=85
