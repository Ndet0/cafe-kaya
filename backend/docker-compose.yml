# Optional: run PostgreSQL locally for development.
# Set POSTGRES_USER, POSTGRES_PASSWORD, and POSTGRES_DB in backend/.env (gitignored).
# Docker Compose loads backend/.env for ${VAR} substitution when run from this directory.
# Set CAFE_DATABASE_URL in the same file to match, e.g.:
#   postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@localhost:5432/${POSTGRES_DB}
# Then: docker compose up -d
#       alembic upgrade head && uvicorn app.main:app --reload

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cafe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in backend/.env}
      POSTGRES_DB: ${POSTGRES_DB:-cafe_kaya}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
